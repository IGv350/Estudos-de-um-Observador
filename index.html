<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de um Observador</title>
    <style>
        /* FONTE PERSONALIZADA */
        @font-face {
            font-family: 'LeorioFont';
            src: url('Leorio.ttf') format('truetype');
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: visible; 
        }

        body {
            color: white;
            font-family: 'LeorioFont', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            position: relative;
        }

        /* IMAGEM GIGANTE CENTRALIZADA DE FUNDO */
        .imagem-secreta-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3500px;
            opacity: 0.06;
            z-index: -1;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .gif-container img {
            width: 450px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .container-principal {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
            width: 80%;
            max-width: 500px;
            z-index: 2;
        }

        h2 {
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }

        p {
            opacity: 0.9;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #000;
            color: white;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            transition: 0.3s;
            font-family: 'LeorioFont', sans-serif;
            font-size: 1.1em;
        }

        input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        #mensagem {
            margin-top: 20px;
            font-weight: bold;
            height: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <img src="Estou%20assistindo%20você.png" class="imagem-secreta-bg" alt="Seja minhas mãos">

    <div class="gif-container">
        <img src="Comp-1_63-_1_.gif" alt="Observador">
    </div>

    <div class="container-principal">
        <h2>Estudos de um Observador</h2>
        <p>Pressione <strong>Enter</strong> para processar a palavra-chave:</p>

        <input type="text" id="campoBusca" placeholder="Aguardando entrada..." autocomplete="off">

        <p id="mensagem"></p>
    </div>

    <script>
        const inputBusca = document.getElementById('campoBusca');
        const mensagem = document.getElementById('mensagem');

        // Foca automaticamente no campo ao abrir a página
        inputBusca.focus();

        inputBusca.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarPalavra();
            }
        });

        function verificarPalavra() {
            const busca = inputBusca.value.toLowerCase().trim();

            if (busca === "") {
                mensagem.innerText = "O campo está vazio.";
                mensagem.style.color = "orange";
                return;
            }

            mensagem.innerText = "Processando requisição...";
            mensagem.style.color = "gray";

            // Procura silenciosamente se existe o arquivo HTML correspondente na sua hospedagem
            fetch(busca + ".html", { method: 'HEAD' })
            .then(response => {
                if (response.ok) {
                    mensagem.innerText = "Chave aceita! Objeto de estudo identificado.";
                    mensagem.style.color = "#00ff00";
                    setTimeout(() => {
                        window.location.href = busca + ".html";
                    }, 800);
                } else {
                    mensagem.innerText = "Objeto não identificado. Tente novamente!";
                    mensagem.style.color = "#ff4444";
                }
            })
            .catch(() => {
                mensagem.innerText = "Objeto não identificado. Tente novamente!";
                mensagem.style.color = "#ff4444";
            });
        }
    </script>
</body>
</html>

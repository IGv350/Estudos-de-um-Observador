<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de um Observador</title>
    <style>
        /* FONTE PERSONALIZADA */
        @font-face {
            font-family: 'LeorioFont';
            src: url('Leorio.ttf') format('truetype');
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: visible; 
        }

        body {
            color: white;
            font-family: 'LeorioFont', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            position: relative;
        }

        /* IMAGEM GIGANTE CENTRALIZADA DE FUNDO */
        .imagem-secreta-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 3500px;
            opacity: 0.06;
            z-index: -1;
            pointer-events: none;
            filter: grayscale(100%);
        }

        .gif-container img {
            width: 450px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .container-principal {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
            width: 80%;
            max-width: 500px;
            z-index: 2;
        }

        h2 {
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }

        p {
            opacity: 0.9;
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #000;
            color: white;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            transition: 0.3s;
            font-family: 'LeorioFont', sans-serif;
            font-size: 1.1em;
        }

        input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        /* ESTILO DO COFRE */
        #secaoCofre {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #333;
            animation: fadeIn 0.8s;
        }

        .inputs-senha {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .digito-cofre {
            width: 50px !important;
            height: 60px;
            font-size: 1.5em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #mensagem {
            margin-top: 20px;
            font-weight: bold;
            height: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <img src="Estou%20assistindo%20você.png" class="imagem-secreta-bg" alt="Seja minhas mãos">

    <div class="gif-container">
        <img src="Comp-1_63-_1_.gif" alt="Observador">
    </div>

    <div class="container-principal">
        <h2>Estudos de um Observador</h2>
        <p>Pressione <strong>Enter</strong> para processar a palavra-chave:</p>

        <input type="text" id="campoBusca" placeholder="Aguardando entrada..." autocomplete="off">

        <p id="mensagem"></p>

        <div id="secaoCofre">
            <p>Insira a senha do cofre</p>
            <div class="inputs-senha">
                <input type="text" maxlength="1" class="digito-cofre">
                <input type="text" maxlength="1" class="digito-cofre">
                <input type="text" maxlength="1" class="digito-cofre">
                <input type="text" maxlength="1" class="digito-cofre">
            </div>
        </div>
    </div>

    <script>
        const inputBusca = document.getElementById('campoBusca');
        const secaoCofre = document.getElementById('secaoCofre');
        const digitos = document.querySelectorAll('.digito-cofre');
        const mensagem = document.getElementById('mensagem');

        // Algoritmo SHA-256 para esconder textos e senhas do F12
        async function gerarHash(texto) {
            const msgBuffer = new TextEncoder().encode(texto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        inputBusca.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                verificarPalavra();
            }
        });

        async function verificarPalavra() {
            const busca = inputBusca.value.toLowerCase().trim();

            secaoCofre.style.display = "none";
            limparCofre();

            if (busca === "") {
                mensagem.innerText = "O campo está vazio.";
                mensagem.style.color = "orange";
                return;
            }

            const hashBusca = await gerarHash(busca);

            // "4ef493..." é o hash criptografado para a palavra "girassol"
            if (hashBusca === "4ef4930510166299b9cf2996847de1b4a0709b1f09ba96ba713ff404f2f9c565") {
                mensagem.innerText = "Acesso parcial. O cofre exige uma combinação.";
                mensagem.style.color = "yellow";
                secaoCofre.style.display = "block";
                digitos[0].focus();
            } 
            else {
                mensagem.innerText = "Processando requisição...";
                mensagem.style.color = "gray";

                // DICA 4 + FETCH: Testa em segundo plano se existe o arquivo html com o nome digitado
                // Funciona para amalgama.html, inane.html e gisele.html sem expor os nomes no código
                fetch(busca + ".html", { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        mensagem.innerText = "Chave aceita! Objeto de estudo identificado.";
                        mensagem.style.color = "#00ff00";
                        setTimeout(() => {
                            window.location.href = busca + ".html";
                        }, 800);
                    } else {
                        mensagem.innerText = "Objeto não identificado. Tente novamente!";
                        mensagem.style.color = "#ff4444";
                    }
                })
                .catch(() => {
                    mensagem.innerText = "Objeto não identificado. Tente novamente!";
                    mensagem.style.color = "#ff4444";
                });
            }
        }

        // Lógica de digitação sequencial do cofre
        digitos.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < digitos.length - 1) {
                    digitos[index + 1].focus();
                }
                verificarSenhaCofre();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && e.target.value === "" && index > 0) {
                    digitos[index - 1].focus();
                }
            });
        });

        async function verificarSenhaCofre() {
            let senhaDigitada = "";
            digitos.forEach(input => senhaDigitada += input.value);

            if (senhaDigitada.length === 4) {
                const hashSenha = await gerarHash(senhaDigitada);

                // "9fb042..." é o hash criptografado para a senha "2702"
                if (hashSenha === "9fb042738374cbdf74288cb431d10292839a9c299c8f2b7405a8f4c2c62cda80") {
                    mensagem.innerText = "Acesso concedido. Abrindo canal seguro...";
                    mensagem.style.color = "#00ff00";
                    setTimeout(() => {
                        window.location.href = "recompensa.html?auth=2702";
                    }, 1000);
                } else {
                    mensagem.innerText = "Senha incorreta.";
                    mensagem.style.color = "red";
                }
            }
        }

        function limparCofre() {
            digitos.forEach(input => input.value = "");
        }
    </script>
</body>
</html>
